services:
  mysql:
    image: mysql:8.0
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: shopflow
      MYSQL_USER: shopflow
      MYSQL_PASSWORD: local-only-password
      MYSQL_ROOT_PASSWORD: local-root-only
      TZ: UTC
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 30
volumes:
  mysql-data:
