services:
  mysql:
    image: mysql:8.0
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: shopflow
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER to a non-root database username}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a nonempty MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a nonempty MYSQL_ROOT_PASSWORD}
      TZ: UTC
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 30
volumes:
  mysql-data:
